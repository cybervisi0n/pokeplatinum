name: build

on:
  push:
    branches: [ pc_port ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  LM_LICENSE_FILE: "${{ github.workspace }}/tools/cw/license.dat"
  BUILD: /var/tmp/pokeplatinum

jobs:
  build_arm:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fuse git python3 wget zip

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Metroskrew
        run: ./drun.sh make skrew

      - name: Build (ARM)
        run: ./drun.sh make

  build_linux:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fuse git python3 wget zip

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Metroskrew
        run: ./drun.sh make skrew

      - name: Build (Linux)
        run: ./drun.sh make linux

      - name: Package release artifact (linux)
        run: ./tools/scripts/package_artifacts_linux.sh

      - name: Upload release artifact (linux)
        uses: actions/upload-artifact@v6
        with:
          name: release_linux
          path: build_linux/release_linux

  build_nx:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fuse git python3 wget zip

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Metroskrew
        run: ./drun.sh make skrew

      - name: Build (NX)
        run: ./drun.sh make nx

      - name: Package release artifact (NX)
        run: ./tools/scripts/package_artifacts_nx.sh

      - name: Upload release artifact (NX)
        uses: actions/upload-artifact@v6
        with:
          name: release_nx
          path: build_nx/release_nx

  build_prospero:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fuse git python3 wget zip

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Metroskrew
        run: ./drun.sh make skrew

      - name: Install Prospero Dependencies
        run: ./drun.sh make prospero-deps

      - name: Build (Prospero)
        run: ./drun.sh make prospero

      - name: Package release artifact (Prospero)
        run: ./tools/scripts/package_artifacts_prospero.sh

      - name: Upload release artifact (Prospero)
        uses: actions/upload-artifact@v6
        with:
          name: release_ps5
          path: build_prospero/release_prospero
